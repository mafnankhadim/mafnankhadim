    <!-- The template's CSS asks for "Montserrat" everywhere but never loads a
         webfont, so the whole site silently fell back to the system sans.
         Inter (UI/body) and Sora (display headings) are loaded here instead and
         applied in src/styles/base.css. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap"
    />

    <!-- Font Awesome 4.7 is the only sheet left from the original template:
         the icon glyphs are still used throughout. Bootstrap, style.css,
         responsive.css, owl.carousel.css and text-rotator.css were dropped in
         the redesign — the layout is now entirely src/styles/. -->
    <link rel="stylesheet" type="text/css" href="/css/font-awesome.min.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
