# Netlify build + function config for mafnankhadim.dev.

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  # esbuild so the function can `import` from src/data (the assistant's
  # knowledge base is generated from the same portfolio data the site renders).
  node_bundler = "esbuild"

# Single-page app: everything that isn't a real file falls back to index.html.
# Functions are matched before this rule, so /.netlify/functions/* still works.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
